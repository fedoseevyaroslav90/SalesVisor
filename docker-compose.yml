# Запуск на сервере: скопируйте .env.example в .env, заполните и выполните docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: salesvisor
      POSTGRES_USER: salesvisor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    image: salesvisor:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://salesvisor:${POSTGRES_PASSWORD}@db/salesvisor
      TZ: ${TZ:-Asia/Yekaterinburg}
    ports:
      # В контуре «Инкаб ИИ»: WEB_BIND=172.16.50.30, чтобы приложение видел только портал
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8102}:8000"
    depends_on: [db]

  # Забирает выгрузки из Metabase или из папки SFTP раз в час
  sync:
    image: salesvisor:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://salesvisor:${POSTGRES_PASSWORD}@db/salesvisor
      TZ: ${TZ:-Asia/Yekaterinburg}
      IMPORT_DIR: /import
    volumes:
      - ${IMPORT_HOST_DIR:-./import}:/import
    command: ["python", "-m", "salesvisor", "sync", "--every", "${SYNC_EVERY:-3600}"]
    depends_on: [db, web]

volumes:
  pgdata:
