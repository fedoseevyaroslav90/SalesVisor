# Запуск на сервере: скопируйте .env.example в .env, заполните и выполните docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: salesvisor
      POSTGRES_USER: salesvisor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://salesvisor:${POSTGRES_PASSWORD}@db/salesvisor
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on: [db]

  # Забирает выгрузки из Metabase раз в час
  sync:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://salesvisor:${POSTGRES_PASSWORD}@db/salesvisor
    command: ["python", "-m", "salesvisor", "sync", "--every", "${SYNC_EVERY:-3600}"]
    depends_on: [db]

volumes:
  pgdata:
