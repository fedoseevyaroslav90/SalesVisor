# SalesVisor «Контроль заказов» (30.09.2026): ручная загрузка выгрузки SAP через портал — до 160 МБ на запрос
# (сервис сам ограничивает 150 МБ; CSV отчёта по отрезкам — около 70 МБ). Только этот адрес; остальной
# /orders/ и сайт — общий предел 64m. Тело идёт потоком, без буфера на диске; разбор отчёта — до 5 минут.
location = /orders/api/upload {
    client_max_body_size 160m;
    client_body_timeout 120s;
    client_body_buffer_size 1m;
    proxy_pass http://127.0.0.1:8095;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}
